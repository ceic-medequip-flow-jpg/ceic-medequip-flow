<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Laudo Único de Correções - CEIC App</title>
  <style>
    body { font-family: Segoe UI, Tahoma, sans-serif; background:#f3f4f6; color:#1f2937; padding:20px; line-height:1.55; }
    .container { max-width:1200px; margin:0 auto; }
    h1 { color:#111827; border-bottom:2px solid #e5e7eb; padding-bottom:10px; }
    .summary { background:#fff; padding:20px; border-radius:8px; box-shadow:0 1px 3px rgba(0,0,0,.1); margin-bottom:30px; display:flex; gap:20px; }
    .summary-box { flex:1; text-align:center; padding:15px; border-radius:6px; font-size:1.1em; font-weight:700; }
    .bg-green { background:#dcfce7; color:#166534; }
    .bg-red { background:#fee2e2; color:#991b1b; }
    .bg-blue { background:#dbeafe; color:#1e40af; }
    .section-title { margin-top:34px; padding:10px; color:#fff; border-radius:6px; }
    .card { background:#fff; padding:20px; margin-top:15px; border-left:6px solid #ef4444; border-radius:8px; box-shadow:0 1px 3px rgba(0,0,0,.1); }
    .badge { display:inline-block; padding:4px 8px; background:#e5e7eb; border-radius:12px; font-size:.85em; font-weight:600; margin:0 8px 8px 0; }
    .badge.danger { background:#fee2e2; color:#991b1b; }
    .layer-diagnosis { background:#eff6ff; border:1px solid #bfdbfe; border-radius:8px; padding:14px; margin-top:14px; }
    .evidence { background:#f9fafb; border:1px solid #e5e7eb; border-radius:8px; padding:14px; margin-top:14px; }
    dl { display:grid; grid-template-columns:220px 1fr; gap:6px 14px; margin:0; }
    dt { font-weight:700; color:#374151; }
    dd { margin:0; }
    code { background:#fee2e2; color:#991b1b; padding:2px 6px; border-radius:4px; }
    pre { background:#111827; color:#f8fafc; padding:12px; border-radius:6px; overflow-x:auto; font-size:.9em; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Laudo Único de Correções do CEIC App</h1>
    <p>Gerado em: <strong>04/05/2026, 01:22:25</strong></p>
    <div class="summary">
      <div class="summary-box bg-blue">Ações Testadas<br><span style="font-size:1.5em">4</span></div>
      <div class="summary-box bg-green">Passaram<br><span style="font-size:1.5em">4</span></div>
      <div class="summary-box bg-red">Falharam<br><span style="font-size:1.5em">0</span></div>
    </div>
</div></body></html>
